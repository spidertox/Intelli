name: Android CI

on:
  push:
    branches: [main, master, "device-access/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agy_ide_bridge/go.mod
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: ./gradlew :app:testStandardDebugUnitTest
      - name: Lint
        run: ./gradlew :app:lintStandardDebug
      - name: Build debug APKs
        run: ./gradlew :app:assembleStandardDebug :app:assembleTermuxDebug :app:assembleTermuxSharedDebug
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: intelli-debug-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Report unit test failures
        if: always()
        run: test "${{ steps.unit_tests.outcome }}" = success
