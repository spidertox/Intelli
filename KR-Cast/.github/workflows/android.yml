name: Android CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            echo "Gradle wrapper not found. Generating..."
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Lint and unit tests
        run: ./gradlew lintDebug testDebugUnitTest --stacktrace
        continue-on-error: true

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
          tag_name: ${{ github.ref }}
          name: KR Cast ${{ github.ref_name }}
          body: |
            ## KR Cast ${{ github.ref_name }}

            ### Assets
            - `app-debug.apk` — Installable app (debug build)

            ### How to install
            1. Download `app-debug.apk`
            2. On your phone, enable "Install from unknown sources"
            3. Open the APK to install KR Cast

            ### Important
            This is a sender app only. Your Samsung TV must have built-in Screen Mirroring / Device Connect Manager enabled.
            Wi‑Fi Direct discovery does not guarantee Miracast streaming — see COMPATIBILITY.md for details.
          draft: false
          prerelease: false

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KR-Cast-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KR-Cast-build-reports
          path: |
            app/build/reports
            app/build/test-results
